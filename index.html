<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Find Fairy</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000;
    overflow: hidden; font-family: -apple-system, sans-serif; }
  .screen { position: fixed; inset: 0; display: none; }
  .screen.active { display: block; }
  .gate { display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; color: #fff; text-align: center; padding: 24px; box-sizing: border-box; }
  .gate p { font-size: 20px; line-height: 1.4; max-width: 320px; }
  .gate button { margin-top: 24px; padding: 14px 32px; font-size: 18px; border-radius: 8px;
    border: none; background: #6a5acd; color: #fff; }
  #screen-game video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #screen-game canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #debug { position: absolute; top: 8px; left: 8px; color: #0f0; font: 12px monospace;
    white-space: pre; z-index: 10; text-shadow: 0 0 2px #000; }
  .hint { font-size: 14px; opacity: 0.7; margin-top: 12px; }
  #screen-end .gate p { font-size: 18px; }
  #end-time { font-size: 36px; font-weight: bold; margin: 8px 0; }
  #end-best { opacity: 0.8; }
  #screen-end button { margin-top: 12px; }
</style>
</head>
<body>

<div id="screen-consent1" class="screen active">
  <div class="gate">
    <p>Fairies hide in your room — let's find them.</p>
    <button id="btn-motion">Begin</button>
  </div>
</div>

<div id="screen-consent2" class="screen">
  <div class="gate">
    <p>Open your eyes.</p>
    <button id="btn-camera">Continue</button>
  </div>
</div>

<div id="screen-error" class="screen">
  <div class="gate">
    <p id="error-message"></p>
    <p id="error-hint" class="hint"></p>
    <button id="btn-retry">Try again</button>
  </div>
</div>

<div id="screen-game" class="screen">
  <video id="camera" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>
  <div id="debug"></div>
</div>

<div id="screen-end" class="screen">
  <div class="gate">
    <p>Found all 5.</p>
    <div id="end-time"></div>
    <div id="end-best"></div>
    <button id="btn-again">Play again</button>
    <button id="btn-share">Share</button>
  </div>
</div>

<script>
const CONFIG = {
  // --- Session ---
  fairyCount: 5,
  spawnPitchRange: 60,     // fairies spawn within +/- this many degrees of pitch

  // --- Visibility / opacity fade (degrees of angular distance) ---
  fadeStartAngle: 30,      // beyond this: fully invisible
  fadeEndAngle: 12,        // within this: fully solid

  // --- Catch ---
  catchAngle: 8,           // must be within this angle to be catchable
  dwellDuration: 1.2,      // seconds of continuous hold to catch
  dwellDecayOnBreak: true, // true = decay gradually, false = instant reset

  // --- Projection ---
  cameraFovDegrees: 52,    // assumed horizontal FOV, portrait rear camera
  // alpha/beta sign conventions differ iOS vs Android (SPEC.md §6) — flip
  // whichever axis moves the wrong way when you turn toward the fairy.
  invertYaw: false,
  invertPitch: false,

  // --- Guidance ---
  edgeGlowMaxOpacity: 0.35,
  audioShimmerEnabled: true,

  // --- M2: brightness spawning ---
  calibrationSeconds: 2,
  luminanceGridCols: 8,
  luminanceGridRows: 6,
  darkRegionPercentile: 30, // spawn in the darkest 30% of sampled regions

  // --- Dev only — MUST be removed before shipping (Gate 2 decides the winner) ---
  catchMode: 'dwell',      // 'dwell' | 'tap'
};

const catchModeParam = new URLSearchParams(location.search).get('catch');
if (catchModeParam === 'dwell' || catchModeParam === 'tap') CONFIG.catchMode = catchModeParam;

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showError(message, hint) {
  document.getElementById('error-message').textContent = message;
  document.getElementById('error-hint').textContent = hint;
  show('screen-error');
}

function wrapTo180(deg) {
  let d = deg % 360;
  if (d > 180) d -= 360;
  if (d < -180) d += 360;
  return d;
}

function smoothstep(edge0, edge1, x) {
  const t = Math.min(1, Math.max(0, (x - edge0) / (edge1 - edge0)));
  return t * t * (3 - 2 * t);
}

// --- Orientation ---
let zeroed = false;
let alpha0 = 0, beta0 = 0;
let currentYaw = 0, currentPitch = 0;
let gotOrientationEvent = false;

function onOrientation(e) {
  if (e.alpha == null || e.beta == null) return;
  gotOrientationEvent = true;
  if (!zeroed) {
    alpha0 = e.alpha;
    beta0 = e.beta;
    zeroed = true;
  }
  currentYaw = wrapTo180(e.alpha - alpha0) * (CONFIG.invertYaw ? -1 : 1);
  currentPitch = (e.beta - beta0) * (CONFIG.invertPitch ? -1 : 1);
}

function startMotion() {
  const need = typeof DeviceOrientationEvent !== 'undefined' &&
    typeof DeviceOrientationEvent.requestPermission === 'function';
  if (need) {
    DeviceOrientationEvent.requestPermission().then(state => {
      if (state === 'granted') {
        window.addEventListener('deviceorientation', onOrientation);
        show('screen-consent2');
      } else {
        showError('Motion access denied.', 'iOS: Settings > Safari > Motion & Orientation Access.');
      }
    }).catch(() => showError('Motion access denied.', 'iOS: Settings > Safari > Motion & Orientation Access.'));
  } else if (window.DeviceOrientationEvent) {
    window.addEventListener('deviceorientation', onOrientation);
    show('screen-consent2');
  } else {
    showError('Find Fairy needs a phone with motion sensors.', 'Open this link on your phone.');
  }
}

// --- Camera ---
let video, canvas, ctx;

function startCamera() {
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(stream => {
      video = document.getElementById('camera');
      video.srcObject = stream;
      canvas = document.getElementById('canvas');
      ctx = canvas.getContext('2d');
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      initAudio();
      startRound();
      show('screen-game');
      // guard: no phone with working gyro ever sent an orientation event
      setTimeout(() => {
        if (!gotOrientationEvent) {
          showError('Find Fairy needs a phone with motion sensors.', 'Open this link on your phone.');
        }
      }, 1500);
      requestAnimationFrame(loop);
    })
    .catch(() => {
      showError('Camera access denied.', 'Android: site settings > Permissions > Camera.');
    });
}

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

// --- Round / fairies ---
let fairies = [];
let caughtCount = 0;
let roundStartTime = 0;
let dwellProgress = 0;
let gameState = 'calibrating'; // 'calibrating' | 'playing'
let calibrationSamples = [];
let calibrationStartTime = 0;
let lumCanvas, lumCtx;

function startRound() {
  zeroed = false;
  fairies = [];
  caughtCount = 0;
  dwellProgress = 0;
  calibrationSamples = [];
  calibrationStartTime = performance.now();
  gameState = 'calibrating';
}

// Sample the video frame's luminance grid, tag each cell with the world
// bearing it corresponds to (screen offset + current yaw/pitch), and
// accumulate into calibrationSamples for pickSpawnBearings() to draw from.
function sampleLuminance() {
  if (video.readyState < 2) return;
  if (!lumCanvas) {
    lumCanvas = document.createElement('canvas');
    lumCanvas.width = CONFIG.luminanceGridCols;
    lumCanvas.height = CONFIG.luminanceGridRows;
    lumCtx = lumCanvas.getContext('2d', { willReadFrequently: true });
  }
  lumCtx.drawImage(video, 0, 0, lumCanvas.width, lumCanvas.height);
  const data = lumCtx.getImageData(0, 0, lumCanvas.width, lumCanvas.height).data;
  const pixelsPerDegree = canvas.width / CONFIG.cameraFovDegrees;

  for (let row = 0; row < CONFIG.luminanceGridRows; row++) {
    for (let col = 0; col < CONFIG.luminanceGridCols; col++) {
      const idx = (row * CONFIG.luminanceGridCols + col) * 4;
      const lum = 0.299 * data[idx] + 0.587 * data[idx + 1] + 0.114 * data[idx + 2];
      const screenX = (col + 0.5) / CONFIG.luminanceGridCols * canvas.width;
      const screenY = (row + 0.5) / CONFIG.luminanceGridRows * canvas.height;
      const yawDelta = (screenX - canvas.width / 2) / pixelsPerDegree;
      const pitchDelta = (screenY - canvas.height / 2) / pixelsPerDegree;
      calibrationSamples.push({
        yaw: wrapTo180(currentYaw + yawDelta),
        pitch: currentPitch + pitchDelta,
        lum,
      });
    }
  }
}

// Single function swap (SPEC.md M2): darkest-region bearings instead of
// Math.random(). Everything downstream (rendering, catching, scoring) is
// unaware of the change.
function pickSpawnBearings() {
  if (calibrationSamples.length === 0) {
    const bearings = [];
    for (let i = 0; i < CONFIG.fairyCount; i++) {
      bearings.push({ yaw: Math.random() * 360, pitch: (Math.random() * 2 - 1) * CONFIG.spawnPitchRange });
    }
    return bearings;
  }
  const sorted = calibrationSamples.slice().sort((a, b) => a.lum - b.lum);
  const poolSize = Math.max(1, Math.ceil(sorted.length * CONFIG.darkRegionPercentile / 100));
  const pool = sorted.slice(0, poolSize);
  const bearings = [];
  for (let i = 0; i < CONFIG.fairyCount; i++) {
    bearings.push(pool[Math.floor(Math.random() * pool.length)]);
  }
  return bearings;
}

function finishCalibration() {
  fairies = pickSpawnBearings().map(b => ({ yaw: b.yaw, pitch: b.pitch, caught: false }));
  gameState = 'playing';
  roundStartTime = performance.now();
}

function catchFairy(f) {
  f.caught = true;
  caughtCount++;
  dwellProgress = 0;
  if (caughtCount >= CONFIG.fairyCount) endRound();
}

function endRound() {
  updateAudio(0);
  const elapsedMs = performance.now() - roundStartTime;
  const elapsedS = elapsedMs / 1000;
  const bestKey = 'findFairyBestMs';
  const prevBest = parseFloat(localStorage.getItem(bestKey));
  const isNewBest = isNaN(prevBest) || elapsedMs < prevBest;
  if (isNewBest) localStorage.setItem(bestKey, elapsedMs);
  const bestMs = isNewBest ? elapsedMs : prevBest;

  document.getElementById('end-time').textContent = elapsedS.toFixed(1) + 's';
  document.getElementById('end-best').textContent =
    'Best: ' + (bestMs / 1000).toFixed(1) + 's' + (isNewBest ? ' (new best!)' : '');
  show('screen-end');
}

// --- Audio shimmer ---
let audioCtx, osc, gainNode;

function initAudio() {
  if (!CONFIG.audioShimmerEnabled) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  osc = audioCtx.createOscillator();
  gainNode = audioCtx.createGain();
  gainNode.gain.value = 0;
  osc.frequency.value = 220;
  osc.connect(gainNode).connect(audioCtx.destination);
  osc.start();
  audioCtx.resume(); // iOS Safari starts AudioContext suspended when created after an await
}

function updateAudio(proximity) {
  if (!CONFIG.audioShimmerEnabled || !gainNode) return;
  gainNode.gain.value = proximity * 0.05;
  osc.frequency.value = 220 + proximity * 300;
}

// --- Fairy rendering ---
function drawFairy(x, y, opacity, t) {
  if (opacity <= 0) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = opacity;

  const coreRadius = 18;
  const grad = ctx.createRadialGradient(x, y, 0, x, y, coreRadius * 3);
  grad.addColorStop(0, 'rgba(255, 240, 180, 1)');
  grad.addColorStop(0.4, 'rgba(255, 200, 100, 0.6)');
  grad.addColorStop(1, 'rgba(255, 200, 100, 0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, coreRadius * 3, 0, Math.PI * 2);
  ctx.fill();

  const particleCount = 8;
  const orbitRadius = coreRadius * 1.8;
  for (let i = 0; i < particleCount; i++) {
    const angle = t * 2 + (i / particleCount) * Math.PI * 2;
    const px = x + Math.cos(angle) * orbitRadius;
    const py = y + Math.sin(angle) * orbitRadius;
    ctx.beginPath();
    ctx.fillStyle = 'rgba(255, 250, 220, 0.9)';
    ctx.arc(px, py, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawEdgeGlow(yawDelta, pitchDelta, intensity) {
  if (intensity <= 0) return;
  const mag = Math.sqrt(yawDelta * yawDelta + pitchDelta * pitchDelta) || 1;
  const ux = yawDelta / mag, uy = pitchDelta / mag;
  const cx = canvas.width / 2, cy = canvas.height / 2;
  const edgeDist = Math.min(canvas.width, canvas.height) / 2 * 0.95;
  const gx = cx + ux * edgeDist, gy = cy + uy * edgeDist;
  const radius = Math.min(canvas.width, canvas.height) * 0.45;

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const grad = ctx.createRadialGradient(gx, gy, 0, gx, gy, radius);
  grad.addColorStop(0, `rgba(255, 210, 120, ${intensity * CONFIG.edgeGlowMaxOpacity})`);
  grad.addColorStop(1, 'rgba(255, 210, 120, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.restore();
}

function drawReticle() {
  const cx = canvas.width / 2, cy = canvas.height / 2;
  ctx.save();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cy, 10, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx - 16, cy); ctx.lineTo(cx - 6, cy);
  ctx.moveTo(cx + 6, cy); ctx.lineTo(cx + 16, cy);
  ctx.moveTo(cx, cy - 16); ctx.lineTo(cx, cy - 6);
  ctx.moveTo(cx, cy + 6); ctx.lineTo(cx, cy + 16);
  ctx.stroke();

  if (CONFIG.catchMode === 'dwell' && dwellProgress > 0) {
    const frac = Math.min(1, dwellProgress / CONFIG.dwellDuration);
    ctx.strokeStyle = 'rgba(255, 220, 140, 0.9)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx, cy, 20, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
}

// --- Catch input (tap mode) ---
document.getElementById('canvas') && document.getElementById('canvas').addEventListener('click', onTap);
function onTap() {
  if (CONFIG.catchMode !== 'tap') return;
  let nearest = null, nearestDist = Infinity;
  for (const f of fairies) {
    if (f.caught) continue;
    const d = angularDistTo(f);
    if (d < nearestDist) { nearestDist = d; nearest = f; }
  }
  if (nearest && nearestDist <= CONFIG.catchAngle) catchFairy(nearest);
}

function angularDistTo(f) {
  const yawDelta = wrapTo180(f.yaw - currentYaw);
  const pitchDelta = f.pitch - currentPitch;
  return Math.sqrt(yawDelta * yawDelta + pitchDelta * pitchDelta);
}

// --- Main loop ---
let frameCount = 0, lastFpsTime = performance.now(), fps = 0, lastFrameTime = performance.now();

function loop(now) {
  const dt = Math.min(0.1, (now - lastFrameTime) / 1000);
  lastFrameTime = now;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  frameCount++;
  if (now - lastFpsTime > 500) {
    fps = Math.round((frameCount * 1000) / (now - lastFpsTime));
    frameCount = 0;
    lastFpsTime = now;
  }

  if (gameState === 'calibrating') {
    sampleLuminance();
    ctx.save();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
    ctx.font = '18px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Slowly look around your room…', canvas.width / 2, canvas.height / 2 - 12);
    ctx.fillText('Finding dark corners…', canvas.width / 2, canvas.height / 2 + 18);
    ctx.restore();

    document.getElementById('debug').textContent =
      `fps: ${fps}\ncalibrating: ${((now - calibrationStartTime) / 1000).toFixed(1)}s  samples: ${calibrationSamples.length}`;

    if (now - calibrationStartTime >= CONFIG.calibrationSeconds * 1000) finishCalibration();
  } else {
    const pixelsPerDegree = canvas.width / CONFIG.cameraFovDegrees;

    let nearestUncaught = null, nearestDist = Infinity;
    for (const f of fairies) {
      if (f.caught) continue;
      const yawDelta = wrapTo180(f.yaw - currentYaw);
      const pitchDelta = f.pitch - currentPitch;
      const angularDist = Math.sqrt(yawDelta * yawDelta + pitchDelta * pitchDelta);
      const opacity = 1 - smoothstep(CONFIG.fadeEndAngle, CONFIG.fadeStartAngle, angularDist);

      if (opacity > 0) {
        const screenX = canvas.width / 2 + yawDelta * pixelsPerDegree;
        const screenY = canvas.height / 2 + pitchDelta * pixelsPerDegree;
        drawFairy(screenX, screenY, opacity, now / 1000);
      }

      if (angularDist < nearestDist) {
        nearestDist = angularDist;
        nearestUncaught = { f, yawDelta, pitchDelta, angularDist };
      }
    }

    if (nearestUncaught) {
      const proximity = 1 - smoothstep(CONFIG.fadeEndAngle, CONFIG.fadeStartAngle, nearestUncaught.angularDist);
      drawEdgeGlow(nearestUncaught.yawDelta, nearestUncaught.pitchDelta, proximity);
      updateAudio(proximity);

      if (CONFIG.catchMode === 'dwell') {
        if (nearestUncaught.angularDist <= CONFIG.catchAngle) {
          dwellProgress += dt;
          if (dwellProgress >= CONFIG.dwellDuration) catchFairy(nearestUncaught.f);
        } else if (CONFIG.dwellDecayOnBreak) {
          dwellProgress = Math.max(0, dwellProgress - dt * 2);
        } else {
          dwellProgress = 0;
        }
      }
    }

    drawReticle();

    document.getElementById('debug').textContent =
      `fps: ${fps}  mode: ${CONFIG.catchMode}\nyaw: ${currentYaw.toFixed(1)}  pitch: ${currentPitch.toFixed(1)}\n` +
      `caught: ${caughtCount}/${CONFIG.fairyCount}  nearest: ${nearestDist === Infinity ? '-' : nearestDist.toFixed(1)}`;
  }

  if (document.getElementById('screen-game').classList.contains('active')) {
    requestAnimationFrame(loop);
  }
}

// --- End screen ---
document.getElementById('btn-again').addEventListener('click', () => {
  startRound();
  show('screen-game');
  requestAnimationFrame(loop);
});

document.getElementById('btn-share').addEventListener('click', () => {
  const text = document.getElementById('end-time').textContent;
  const shareData = { title: 'Find Fairy', text: `I found 5 fairies in ${text} — `, url: location.href };
  if (navigator.share) {
    navigator.share(shareData).catch(() => {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(location.href).then(() => {
      const btn = document.getElementById('btn-share');
      const original = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = original; }, 1500);
    });
  }
});

document.getElementById('btn-motion').addEventListener('click', startMotion);
document.getElementById('btn-camera').addEventListener('click', startCamera);
document.getElementById('btn-retry').addEventListener('click', () => {
  zeroed = false;
  gotOrientationEvent = false;
  show('screen-consent1');
});

if (!window.DeviceOrientationEvent) {
  showError('Find Fairy needs a phone with motion sensors.', 'Open this link on your phone.');
}
</script>
</body>
</html>
